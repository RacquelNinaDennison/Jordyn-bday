<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5d8bd"><title>A little duck told me — Happy birthday, Jordyn</title><meta name="description" content="A little birthday letter for Jordyn’s 24th."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ctext y='32' font-size='32'%3E🌼%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="styles.css"><script defer src="card.js"></script></head><body class="card-page meadow" data-card="meadow"><main class="world"><img class="world-art" src="assets/meadow.png" alt="Two little duck friends together in a sunset meadow"><div class="sky-wash"></div><nav class="card-nav"><a href="index.html" aria-label="Back to all birthday card ideas">← All worlds</a></nav><div class="specks" aria-hidden="true"></div><section class="card-heading"><p class="eyebrow">A LITTLE DUCK TOLD ME…</p><h1>Life is sweeter<br>with you in it!!</h1><p class="handwritten">Especially today, Jordyn.</p><span class="age-stamp">24 <small>lovely years of you</small></span></section><div class="card-bottom"><p>A little birthday love, from me to you.</p><button class="primary" id="main-action">Open your little letter <span>♡</span></button><span class="tiny-note">Take a breath. You’re somewhere lovely.</span></div><dialog id="letter" class="letter-dialog"><button class="close-dialog" aria-label="Close letter">×</button><p class="eyebrow" id="letter-count">A love letter for you</p><div class="letter-page" aria-live="polite"><span class="letter-symbol" aria-hidden="true">♡</span><h2 id="letter-title"></h2><p id="letter-copy"></p></div><button class="primary" id="letter-next">There’s more →</button><div class="page-dots" aria-hidden="true"><i></i><i></i><i></i></div></dialog></main><div class="particles" aria-hidden="true"></div></body></html>
